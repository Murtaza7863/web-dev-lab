  <!--
  EXERCISE 5 — Build a list

  INSTRUCTIONS:
  Replace each ___ with the correct tag name.

  <h2>All expenses</h2>
  <___>
    <___>Coffee — $4.50 — Food</___>
    <___>Bus pass — $30.00 — Transport</___>
    <___>Netflix — $15.99 — Entertainment</___>
  </___>

  <h2>Menu (like your Java CLI)</h2>
  <___>

    <___>View All Expenses</___>
    <___>Exit</___>
  </___>
